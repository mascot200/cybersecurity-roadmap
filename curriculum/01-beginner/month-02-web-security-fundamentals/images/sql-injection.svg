<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SQL injection: when data becomes code</text>

  <!-- vulnerable -->
  <rect x="25" y="60" width="465" height="390" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="257" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c">❌ String concatenation</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">
    <text x="45" y="125">input email = </text>
    <text x="160" y="125" fill="#b91c1c" font-weight="700">' OR '1'='1' --</text>
    <rect x="40" y="145" width="435" height="78" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="52" y="170">"SELECT * FROM users</text>
    <text x="52" y="190"> WHERE email = '" + email + "'"</text>
    <text x="52" y="210" fill="#64748b">// builds ONE string; DB parses it all</text>
    <text x="45" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700">The database receives:</text>
    <rect x="40" y="264" width="435" height="58" rx="8" fill="#ffffff" stroke="#fca5a5"/>
    <text x="52" y="288">SELECT * FROM users WHERE email = ''</text>
    <text x="52" y="308"><tspan fill="#b91c1c" font-weight="700">OR '1'='1'</tspan> <tspan fill="#94a3b8">--'</tspan></text>
  </g>
  <g font-size="13" fill="#7f1d1d">
    <text x="45" y="350">• The quote closes the string; attacker's text is parsed as SQL</text>
    <text x="45" y="372">• '1'='1' is always true → returns every user</text>
    <text x="45" y="394">• -- comments out the rest of the query</text>
    <text x="45" y="416">• Worse payloads: UNION SELECT, stacked queries, time-based</text>
    <text x="45" y="438">  blind (pg_sleep), data exfiltration</text>
  </g>

  <!-- safe -->
  <rect x="510" y="60" width="465" height="390" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="742" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">✅ Parameterized query</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#0f172a">
    <text x="530" y="125">input email = </text>
    <text x="645" y="125" fill="#b91c1c" font-weight="700">' OR '1'='1' --</text>
    <rect x="525" y="145" width="435" height="78" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="537" y="170">db.query("SELECT * FROM users</text>
    <text x="537" y="190">  WHERE email = $1", [email])</text>
    <text x="537" y="210" fill="#64748b">// query and data sent SEPARATELY</text>
    <text x="530" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700">The database receives:</text>
    <rect x="525" y="264" width="435" height="58" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="537" y="288">PARSE: ... WHERE email = $1</text>
    <text x="537" y="308">BIND $1 = <tspan fill="#15803d" font-weight="700">"' OR '1'='1' --"</tspan> (just text)</text>
  </g>
  <g font-size="13" fill="#14532d">
    <text x="530" y="350">• SQL structure is fixed before data arrives</text>
    <text x="530" y="372">• Input can never change the query's meaning</text>
    <text x="530" y="394">• Returns 0 rows (no user has that email)</text>
    <text x="530" y="416">• Identifiers (table/column/ORDER BY) can't be</text>
    <text x="530" y="438">  parameters → use an allowlist</text>
  </g>
</svg>
