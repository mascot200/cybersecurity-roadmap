<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Three kinds of XSS — where the malicious script comes from</text>

  <g font-size="14" fill="#0f172a">
    <!-- Stored -->
    <rect x="20" y="60" width="310" height="360" rx="14" fill="#fef2f2" stroke="#ef4444"/>
    <text x="175" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">STORED (persistent)</text>
    <text x="40" y="120">1. Attacker posts a comment:</text>
    <text x="40" y="142" font-family="Consolas, monospace" font-size="12" fill="#b91c1c">&lt;img src=x onerror=steal()&gt;</text>
    <text x="40" y="170">2. Server saves it in the DB</text>
    <text x="40" y="198">3. Every visitor loads the page</text>
    <text x="40" y="226">4. Script runs in THEIR browser</text>
    <text x="40" y="254">   with the site's privileges</text>
    <text x="40" y="294" font-weight="700">Impact: many victims, no click</text>
    <text x="40" y="318">Example: MySpace "Samy" worm (2005)</text>
    <text x="40" y="342">spread to 1M+ profiles in ~20 h</text>
    <text x="40" y="384" font-weight="700" fill="#15803d">Fix: encode on output,</text>
    <text x="40" y="404" fill="#15803d">sanitize allowed HTML, CSP</text>

    <!-- Reflected -->
    <rect x="345" y="60" width="310" height="360" rx="14" fill="#fff7ed" stroke="#f97316"/>
    <text x="500" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">REFLECTED</text>
    <text x="365" y="120">1. Attacker crafts a link:</text>
    <text x="365" y="142" font-family="Consolas, monospace" font-size="11" fill="#c2410c">/search?q=&lt;script&gt;…&lt;/script&gt;</text>
    <text x="365" y="170">2. Victim clicks it (phishing)</text>
    <text x="365" y="198">3. Server echoes q into HTML:</text>
    <text x="365" y="220" font-family="Consolas, monospace" font-size="12">"Results for ${q}"</text>
    <text x="365" y="248">4. Script runs for that victim</text>
    <text x="365" y="294" font-weight="700">Impact: one victim per click</text>
    <text x="365" y="318">Often in search, error pages,</text>
    <text x="365" y="342">redirect messages</text>
    <text x="365" y="384" font-weight="700" fill="#15803d">Fix: context-aware output</text>
    <text x="365" y="404" fill="#15803d">encoding (templating auto-escape)</text>

    <!-- DOM -->
    <rect x="670" y="60" width="310" height="360" rx="14" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="825" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">DOM-BASED</text>
    <text x="690" y="120">1. Link with payload in the</text>
    <text x="690" y="142">   URL fragment: /#&lt;img onerror=…&gt;</text>
    <text x="690" y="170">2. Server never sees it</text>
    <text x="690" y="198">3. Client JS writes it unsafely:</text>
    <text x="690" y="220" font-family="Consolas, monospace" font-size="12">el.innerHTML = location.hash</text>
    <text x="690" y="248">4. Browser executes it</text>
    <text x="690" y="294" font-weight="700">Impact: invisible to server logs</text>
    <text x="690" y="318">Sources: location, postMessage</text>
    <text x="690" y="342">Sinks: innerHTML, eval, document.write</text>
    <text x="690" y="384" font-weight="700" fill="#15803d">Fix: textContent, safe sinks,</text>
    <text x="690" y="404" fill="#15803d">Trusted Types, DOMPurify</text>
  </g>
</svg>
