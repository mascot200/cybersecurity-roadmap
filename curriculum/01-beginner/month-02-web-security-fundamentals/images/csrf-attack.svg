<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CSRF — the browser attaches your cookie to someone else's request</text>
  <g font-size="14" fill="#0f172a">
    <rect x="30" y="70" width="200" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="130" y="105" text-anchor="middle" font-weight="700">Victim's browser</text>
    <text x="130" y="128" text-anchor="middle" font-size="12">logged in to bank.example</text>
    <text x="130" y="146" text-anchor="middle" font-size="12">cookie: sid=abc</text>

    <rect x="400" y="70" width="200" height="90" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="500" y="105" text-anchor="middle" font-weight="700">evil.example</text>
    <text x="500" y="128" text-anchor="middle" font-size="12">attacker's page with a</text>
    <text x="500" y="146" text-anchor="middle" font-size="12">hidden auto-submitting form</text>

    <rect x="770" y="70" width="200" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="870" y="105" text-anchor="middle" font-weight="700">bank.example</text>
    <text x="870" y="128" text-anchor="middle" font-size="12">POST /transfer</text>
    <text x="870" y="146" text-anchor="middle" font-size="12">trusts the cookie only</text>

    <line x1="230" y1="100" x2="395" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#c)"/>
    <text x="312" y="92" text-anchor="middle" font-size="12">① visits</text>
    <line x1="395" y1="140" x2="235" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#c)"/>
    <text x="312" y="160" text-anchor="middle" font-size="12">② page with form</text>
    <path d="M130,160 C130,212 865,212 865,165" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#c)"/>
    <text x="500" y="230" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">③ POST /transfer to=attacker&amp;amount=1000  +  Cookie: sid=abc (attached automatically!)</text>
    <text x="500" y="265" text-anchor="middle" font-size="13" fill="#166534">④ Bank sees a valid session → transfers money</text>

    <rect x="30" y="290" width="940" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="50" y="316" font-weight="700">Defenses (layer them):</text>
    <text x="50" y="340">• SameSite=Lax/Strict cookies — browser won't attach the cookie to cross-site POSTs</text>
    <text x="50" y="362">• Anti-CSRF token (synchronizer / double-submit) that evil.example can't read  • Check Origin / Sec-Fetch-Site headers</text>
    <text x="50" y="380" font-size="12" fill="#475569">Not a CSRF defense: CORS (it limits reading responses, not sending requests) · POST-only endpoints · "secret" URLs</text>
  </g>
</svg>
