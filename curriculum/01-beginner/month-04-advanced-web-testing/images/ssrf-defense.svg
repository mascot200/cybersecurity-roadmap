<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs><marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SSRF: why server-side fetches need their own guard</text>

  <g font-size="14" fill="#0f172a">
    <rect x="30" y="64" width="170" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="115" y="94" text-anchor="middle" font-weight="700">Client</text>
    <text x="115" y="116" text-anchor="middle" font-size="12">"fetch this image URL"</text>

    <rect x="290" y="64" width="200" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="390" y="94" text-anchor="middle" font-weight="700">Your API server</text>
    <text x="390" y="116" text-anchor="middle" font-size="12">inside your network</text>

    <rect x="590" y="56" width="380" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="780" y="79" text-anchor="middle" font-size="13">intended: https://images.example.com</text>
    <rect x="590" y="100" width="380" height="36" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="780" y="123" text-anchor="middle" font-size="13">must never reach: metadata, localhost, private IPs</text>

    <line x1="200" y1="99" x2="285" y2="99" stroke="#334155" stroke-width="2" marker-end="url(#s)"/>
    <line x1="490" y1="90" x2="585" y2="74" stroke="#16a34a" stroke-width="2" marker-end="url(#s)"/>
    <line x1="490" y1="108" x2="585" y2="118" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#s)"/>
    <text x="390" y="160" text-anchor="middle" font-size="12" fill="#475569">The server's network position is what makes it dangerous: it can reach places the client can't.</text>
  </g>

  <text x="500" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Layered checks in labs/ssrf-guard</text>
  <g font-size="13" fill="#0f172a">
    <rect x="30" y="215" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="120" y="240" text-anchor="middle" font-weight="700">1 · Parse</text>
    <text x="45" y="264">WHATWG URL parser</text>
    <text x="45" y="284">https only</text>
    <text x="45" y="304">no user:pass@</text>
    <text x="45" y="324">port 443 only</text>

    <rect x="225" y="215" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="315" y="240" text-anchor="middle" font-weight="700">2 · Allowlist</text>
    <text x="240" y="264">exact hostname match</text>
    <text x="240" y="284">from configuration</text>
    <text x="240" y="304">(strongest control)</text>

    <rect x="420" y="215" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="510" y="240" text-anchor="middle" font-weight="700">3 · Resolve DNS</text>
    <text x="435" y="264">check EVERY address</text>
    <text x="435" y="284">against a block list:</text>
    <text x="435" y="304">loopback, private,</text>
    <text x="435" y="324">link-local, IPv6, mapped</text>

    <rect x="615" y="215" width="180" height="120" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="705" y="240" text-anchor="middle" font-weight="700">4 · Pin + fetch</text>
    <text x="630" y="264">connect to the vetted IP</text>
    <text x="630" y="284">(defeats DNS rebinding)</text>
    <text x="630" y="304">no redirects followed</text>
    <text x="630" y="324">timeouts, size limits</text>

    <rect x="810" y="215" width="160" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="890" y="240" text-anchor="middle" font-weight="700">5 · Infrastructure</text>
    <text x="822" y="264">IMDSv2 (token)</text>
    <text x="822" y="284">egress firewall</text>
    <text x="822" y="304">least-privilege role</text>
    <text x="822" y="324">(Months 7 &amp; 9)</text>
  </g>
  <text x="500" y="370" text-anchor="middle" font-size="13" fill="#475569">Blocklisting strings like "localhost" is not enough: encodings, DNS names and redirects bypass it.</text>
  <text x="500" y="392" text-anchor="middle" font-size="13" fill="#475569">Decide on the parsed URL and the resolved IP, never on the raw string.</text>
  <text x="500" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">OWASP API Top 10: API7 Server Side Request Forgery</text>
</svg>
