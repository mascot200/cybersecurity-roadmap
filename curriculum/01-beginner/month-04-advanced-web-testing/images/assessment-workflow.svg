<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="300" fill="#ffffff"/>
  <defs><marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">A professional assessment, start to finish</text>
  <g font-size="13" fill="#0f172a">
    <rect x="20" y="70" width="150" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="95" y="96" text-anchor="middle" font-weight="700" font-size="15">1 · Authorize</text>
    <text x="32" y="122">written scope</text>
    <text x="32" y="142">rules of engagement</text>
    <text x="32" y="162">test accounts</text>
    <text x="32" y="182">contacts, time window</text>

    <rect x="185" y="70" width="150" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="260" y="96" text-anchor="middle" font-weight="700" font-size="15">2 · Map</text>
    <text x="197" y="122">endpoints, roles</text>
    <text x="197" y="142">data flows</text>
    <text x="197" y="162">trust boundaries</text>
    <text x="197" y="182">threat model</text>

    <rect x="350" y="70" width="150" height="150" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="425" y="96" text-anchor="middle" font-weight="700" font-size="15">3 · Test</text>
    <text x="362" y="122">follow a checklist</text>
    <text x="362" y="142">(OWASP WSTG)</text>
    <text x="362" y="162">proxy in lab only</text>
    <text x="362" y="182">minimal impact</text>

    <rect x="515" y="70" width="150" height="150" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="590" y="96" text-anchor="middle" font-weight="700" font-size="15">4 · Evidence</text>
    <text x="527" y="122">request/response</text>
    <text x="527" y="142">timestamps</text>
    <text x="527" y="162">redacted screenshots</text>
    <text x="527" y="182">steps to reproduce</text>

    <rect x="680" y="70" width="150" height="150" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="755" y="96" text-anchor="middle" font-weight="700" font-size="15">5 · Report</text>
    <text x="692" y="122">severity + rationale</text>
    <text x="692" y="142">impact in business</text>
    <text x="692" y="162">terms</text>
    <text x="692" y="182">specific remediation</text>

    <rect x="845" y="70" width="135" height="150" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="912" y="96" text-anchor="middle" font-weight="700" font-size="15">6 · Retest</text>
    <text x="857" y="122">verify each fix</text>
    <text x="857" y="142">regression test</text>
    <text x="857" y="162">residual risk</text>
    <text x="857" y="182">close findings</text>

    <line x1="170" y1="145" x2="183" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#w)"/>
    <line x1="335" y1="145" x2="348" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#w)"/>
    <line x1="500" y1="145" x2="513" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#w)"/>
    <line x1="665" y1="145" x2="678" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#w)"/>
    <line x1="830" y1="145" x2="843" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#w)"/>
  </g>
  <text x="500" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">No written authorization → no testing. Stay inside scope, stop and report if you find real user data.</text>
  <text x="500" y="282" text-anchor="middle" font-size="13" fill="#475569">The report is the product: a finding nobody can understand or reproduce doesn't get fixed.</text>
</svg>
