<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The journey of https://shop.example.com/login</text>

  <g font-size="14" fill="#0f172a">
    <rect x="30" y="70" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="105" y="104" text-anchor="middle" font-weight="700">Browser</text>
    <text x="105" y="126" text-anchor="middle" font-size="12">your laptop</text>

    <rect x="260" y="70" width="170" height="80" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="345" y="104" text-anchor="middle" font-weight="700">DNS resolver</text>
    <text x="345" y="126" text-anchor="middle" font-size="12">root → .com → example.com</text>

    <rect x="510" y="70" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="595" y="100" text-anchor="middle" font-weight="700">Load balancer /</text>
    <text x="595" y="120" text-anchor="middle" font-weight="700">reverse proxy</text>
    <text x="595" y="140" text-anchor="middle" font-size="12">TLS terminates here</text>

    <rect x="760" y="70" width="140" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="830" y="104" text-anchor="middle" font-weight="700">App server</text>
    <text x="830" y="126" text-anchor="middle" font-size="12">Node.js API</text>

    <rect x="960" y="70" width="110" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="1015" y="104" text-anchor="middle" font-weight="700">Database</text>
    <text x="1015" y="126" text-anchor="middle" font-size="12">PostgreSQL</text>
  </g>

  <!-- trust boundaries -->
  <line x1="470" y1="58" x2="470" y2="158" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="470" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">TRUST BOUNDARY: internet → your network</text>
  <line x1="930" y1="58" x2="930" y2="158" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="930" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">TRUST BOUNDARY: app → data</text>

  <g font-size="13" fill="#0f172a">
    <line x1="180" y1="170" x2="255" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <text x="40" y="196">① DNS: "A record for shop.example.com?" → 203.0.113.10 (UDP/TCP 53, or DoH)</text>
    <line x1="180" y1="215" x2="505" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <text x="40" y="241">② TCP 3-way handshake to 203.0.113.10:443  — SYN → SYN/ACK → ACK</text>
    <line x1="180" y1="260" x2="505" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <text x="40" y="286">③ TLS 1.3 handshake — certificate checked, keys agreed, channel encrypted</text>
    <line x1="560" y1="360" x2="755" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <text x="40" y="366">④ HTTP: POST /login (encrypted) → proxy forwards →</text>
    <line x1="900" y1="390" x2="955" y2="390" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <text x="40" y="396">⑤ App validates input, queries DB with a parameterized query, verifies password hash →</text>
    <text x="40" y="426">⑥ Response: 200 + Set-Cookie: session=…; Secure; HttpOnly; SameSite=Lax → browser stores cookie</text>
    <text x="40" y="452" fill="#475569" font-size="12">Every arrow is a place something can go wrong: DNS spoofing · TLS misconfig · injection · broken auth · data exposure.</text>
  </g>
</svg>
