<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Defense in depth — layers around your data</text>
  <g font-size="14" font-weight="700">
    <rect x="40" y="55" width="560" height="400" rx="20" fill="#fee2e2" stroke="#ef4444"/>
    <text x="60" y="80" fill="#991b1b">Policies &amp; people — training, MFA, least privilege</text>
    <rect x="75" y="95" width="490" height="345" rx="18" fill="#ffedd5" stroke="#f97316"/>
    <text x="95" y="120" fill="#9a3412">Perimeter — WAF, DDoS protection, rate limits</text>
    <rect x="110" y="135" width="420" height="290" rx="16" fill="#fef9c3" stroke="#eab308"/>
    <text x="130" y="160" fill="#854d0e">Network — private subnets, security groups</text>
    <rect x="145" y="175" width="350" height="235" rx="14" fill="#dcfce7" stroke="#22c55e"/>
    <text x="165" y="200" fill="#166534">Host — patching, hardening, non-root</text>
    <rect x="180" y="215" width="280" height="180" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="200" y="240" fill="#1e40af">Application — authn/z, validation</text>
    <rect x="215" y="255" width="210" height="125" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="320" y="300" text-anchor="middle" fill="#5b21b6">DATA</text>
    <text x="320" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#5b21b6">encryption at rest,</text>
    <text x="320" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#5b21b6">backups, access</text>
    <text x="320" y="360" text-anchor="middle" font-size="12" font-weight="400" fill="#5b21b6">control</text>
  </g>
  <g font-size="13" fill="#0f172a">
    <text x="630" y="90" font-weight="700">Attacker steals a password (✗ = stopped)</text>
    <text x="630" y="118">✗ Policies: MFA blocks the login</text>
    <text x="630" y="142">  …but say MFA was skipped →</text>
    <text x="630" y="170">✗ App: user's role can't reach admin API</text>
    <text x="630" y="194">  …but say an IDOR exists →</text>
    <text x="630" y="222">✗ Network: DB isn't internet-reachable</text>
    <text x="630" y="250">✗ Data: PII encrypted, keys elsewhere</text>
    <text x="630" y="278">✓ Detection: unusual-access alert fires</text>
    <text x="630" y="318" font-weight="700">One layer failing ≠ breach.</text>
    <text x="630" y="340">Each layer should assume the one</text>
    <text x="630" y="360">outside it has already failed.</text>
  </g>
</svg>
