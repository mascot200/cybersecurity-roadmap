<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Hardened deployment: one way in, private everything else</text>

  <rect x="20" y="60" width="960" height="310" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="40" y="84" font-size="14" font-weight="700" fill="#475569">Linux host — ufw default deny · key-only SSH · auto-updates · auditd (Week 23)</text>

  <g font-size="13" fill="#0f172a">
    <rect x="40" y="110" width="150" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="115" y="140" text-anchor="middle" font-weight="700">Client</text>
    <text x="115" y="162" text-anchor="middle" font-size="12">HTTPS only</text>
    <text x="115" y="180" text-anchor="middle" font-size="12">127.0.0.1:8443</text>

    <rect x="250" y="100" width="300" height="250" rx="14" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="400" y="122" text-anchor="middle" font-weight="700" fill="#854d0e">network: frontend</text>

    <rect x="580" y="100" width="380" height="250" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="770" y="122" text-anchor="middle" font-weight="700" fill="#166534">network: backend (internal: true, no internet)</text>

    <rect x="270" y="140" width="180" height="120" rx="12" fill="#ffffff" stroke="#ca8a04"/>
    <text x="360" y="164" text-anchor="middle" font-weight="700">proxy (nginx, non-root)</text>
    <text x="282" y="188" font-size="12">TLS 1.2/1.3, HSTS, headers</text>
    <text x="282" y="206" font-size="12">rate limit, body limit</text>
    <text x="282" y="224" font-size="12">dotfiles denied</text>
    <text x="282" y="242" font-size="12">only published service</text>

    <rect x="470" y="140" width="200" height="120" rx="12" fill="#ffffff" stroke="#16a34a"/>
    <text x="570" y="164" text-anchor="middle" font-weight="700">api (node user)</text>
    <text x="482" y="188" font-size="12">read-only root FS</text>
    <text x="482" y="206" font-size="12">cap_drop ALL, no-new-privs</text>
    <text x="482" y="224" font-size="12">DB password from file secret</text>
    <text x="482" y="242" font-size="12">no published ports</text>

    <rect x="740" y="140" width="200" height="120" rx="12" fill="#ffffff" stroke="#16a34a"/>
    <text x="840" y="164" text-anchor="middle" font-weight="700">db (PostgreSQL)</text>
    <text x="752" y="188" font-size="12">backend network only</text>
    <text x="752" y="206" font-size="12">no published ports</text>
    <text x="752" y="224" font-size="12">least-privilege app role</text>
    <text x="752" y="242" font-size="12">named volume, backups (M10)</text>

    <line x1="190" y1="160" x2="265" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#h)"/>
    <line x1="450" y1="200" x2="465" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#h)"/>
    <line x1="670" y1="200" x2="735" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#h)"/>

    <text x="270" y="290" font-size="12" fill="#854d0e">✗ client → api directly: no port</text>
    <text x="600" y="290" font-size="12" fill="#166534">✗ client → db: not on any reachable network</text>
    <text x="600" y="310" font-size="12" fill="#166534">✗ db → internet: internal network</text>
    <text x="270" y="310" font-size="12" fill="#854d0e">✓ every container: CPU, memory, PID limits</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <text x="40" y="400" font-weight="700">Image (Week 22):</text>
    <text x="170" y="400">pinned base, multi-stage, npm ci --omit=dev --ignore-scripts, scanned (Trivy/Grype), SBOM (Syft)</text>
    <text x="40" y="424" font-weight="700">Secrets:</text>
    <text x="170" y="424">files mounted at /run/secrets, generated locally, git-ignored; never in images or `docker inspect` env</text>
    <text x="40" y="448" font-weight="700">Verify:</text>
    <text x="170" y="448">scripts/verify.sh checks each of these properties on the running stack</text>
  </g>
</svg>
