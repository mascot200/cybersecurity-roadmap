# Hardened local deployment: proxy (public) → api (private) → db (private, no internet).
name: hardened-deploy

x-hardening: &hardening
  read_only: true                      # root filesystem is read-only
  cap_drop: [ALL]                      # drop every Linux capability
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  proxy:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"          # only the proxy is published, and only on localhost
      - "127.0.0.1:8080:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    tmpfs: [/tmp]
    networks: [frontend]
    depends_on: [api]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 100 }

  api:
    <<: *hardening
    build: ./api
    environment:
      DB_HOST: db
      DB_USER: app
      DB_NAME: app
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    tmpfs: [/tmp]
    networks: [frontend, backend]      # no ports: reachable only through the proxy
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 200 }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [backend]                # internal network only; no ports published
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 200 }

networks:
  frontend: {}
  backend:
    internal: true                     # no route to the internet

secrets:
  db_password:
    file: ./secrets/db_password.txt    # generated locally, never committed

volumes:
  dbdata: {}
