<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Reference architecture: the invoices API on AWS</text>

  <g font-size="13" fill="#0f172a">
    <rect x="20" y="70" width="120" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="80" y="100" text-anchor="middle" font-weight="700">Users</text>
    <text x="80" y="120" text-anchor="middle" font-size="12">HTTPS</text>

    <rect x="160" y="50" width="640" height="340" rx="16" fill="#f8fafc" stroke="#64748b"/>
    <text x="180" y="72" font-weight="700" fill="#334155">VPC 10.0.0.0/16 (two availability zones; one shown)</text>

    <rect x="180" y="86" width="190" height="110" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="275" y="106" text-anchor="middle" font-weight="700" fill="#854d0e">Public subnet</text>
    <rect x="195" y="116" width="160" height="66" rx="8" fill="#ffffff" stroke="#ca8a04"/>
    <text x="275" y="140" text-anchor="middle" font-weight="700">Load balancer</text>
    <text x="275" y="160" text-anchor="middle" font-size="12">TLS (ACM cert), WAF</text>
    <text x="275" y="176" text-anchor="middle" font-size="12">SG: 443 from internet</text>

    <rect x="390" y="86" width="190" height="290" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="485" y="106" text-anchor="middle" font-weight="700" fill="#166534">Private app subnet</text>
    <rect x="405" y="116" width="160" height="80" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="485" y="140" text-anchor="middle" font-weight="700">API tasks (ECS)</text>
    <text x="485" y="160" text-anchor="middle" font-size="12">task role: least privilege</text>
    <text x="485" y="176" text-anchor="middle" font-size="12">SG: 3000 from LB SG only</text>
    <rect x="405" y="210" width="160" height="70" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="485" y="234" text-anchor="middle" font-weight="700">VPC endpoints</text>
    <text x="485" y="254" text-anchor="middle" font-size="12">S3, Secrets Manager,</text>
    <text x="485" y="270" text-anchor="middle" font-size="12">KMS, ECR, Logs</text>
    <text x="405" y="306" font-size="12">egress: endpoints or a</text>
    <text x="405" y="322" font-size="12">NAT gateway (filtered)</text>
    <text x="405" y="352" font-size="12" font-weight="700">No public IPs</text>

    <rect x="600" y="86" width="185" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="692" y="106" text-anchor="middle" font-weight="700" fill="#5b21b6">Private data subnet</text>
    <rect x="612" y="116" width="160" height="110" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <text x="692" y="140" text-anchor="middle" font-weight="700">RDS PostgreSQL</text>
    <text x="692" y="160" text-anchor="middle" font-size="12">not publicly accessible</text>
    <text x="692" y="176" text-anchor="middle" font-size="12">encrypted (KMS), TLS</text>
    <text x="692" y="192" text-anchor="middle" font-size="12">SG: 5432 from API SG</text>
    <text x="692" y="212" text-anchor="middle" font-size="12">backups + snapshot copies</text>

    <line x1="140" y1="105" x2="190" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#c)"/>
    <line x1="355" y1="150" x2="400" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#c)"/>
    <line x1="565" y1="160" x2="607" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#c)"/>
    <line x1="485" y1="196" x2="485" y2="206" stroke="#334155" stroke-width="2" marker-end="url(#c)"/>

    <rect x="820" y="60" width="165" height="100" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="902" y="84" text-anchor="middle" font-weight="700">S3 uploads bucket</text>
    <text x="832" y="106" font-size="12">Block Public Access</text>
    <text x="832" y="122" font-size="12">SSE-KMS, TLS-only</text>
    <text x="832" y="138" font-size="12">versioning</text>

    <rect x="820" y="172" width="165" height="88" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="902" y="196" text-anchor="middle" font-weight="700">KMS + Secrets</text>
    <text x="832" y="218" font-size="12">customer-managed key</text>
    <text x="832" y="234" font-size="12">DB secret, rotation</text>

    <rect x="820" y="272" width="165" height="104" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="902" y="296" text-anchor="middle" font-weight="700">Logging account</text>
    <text x="832" y="318" font-size="12">CloudTrail (all regions)</text>
    <text x="832" y="334" font-size="12">VPC flow logs</text>
    <text x="832" y="350" font-size="12">GuardDuty, Config</text>
    <text x="832" y="366" font-size="12">log bucket: write-only</text>
    <path d="M565,250 C640,300 800,300 810,118" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#c)"/>
    <path d="M565,262 C660,290 780,280 815,222" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#c)"/>
  </g>

  <g font-size="13" fill="#0f172a">
    <text x="20" y="420" font-weight="700">Identity (W25):</text>
    <text x="160" y="420">humans via SSO + MFA (no IAM users), separate admin vs app identities, CI via OIDC (Month 8)</text>
    <text x="20" y="444" font-weight="700">Network (W26):</text>
    <text x="160" y="444">security groups reference each other; database never in a public subnet; no 0.0.0.0/0 except LB 443</text>
    <text x="20" y="468" font-weight="700">Data (W27):</text>
    <text x="160" y="468">encryption at rest with KMS, TLS in transit, backups tested, secrets in Secrets Manager</text>
    <text x="20" y="492" font-weight="700">Logging (W28):</text>
    <text x="160" y="492">CloudTrail to a separate account, alerts on root use and IAM changes, budget alarms</text>
  </g>
</svg>
