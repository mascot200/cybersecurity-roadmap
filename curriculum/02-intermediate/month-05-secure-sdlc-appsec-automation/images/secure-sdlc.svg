<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Secure development lifecycle: a control at every stage</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#475569">The earlier a flaw is caught, the cheaper it is to fix ("shift left"), but every stage still needs a check.</text>

  <g font-size="13" fill="#0f172a">
    <rect x="20" y="80" width="150" height="200" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="95" y="106" text-anchor="middle" font-weight="700" font-size="15">Design</text>
    <text x="32" y="134">threat model (W19)</text>
    <text x="32" y="156">security requirements</text>
    <text x="32" y="178">(OWASP ASVS)</text>
    <text x="32" y="200">abuse cases</text>
    <text x="32" y="250" fill="#6d28d9" font-weight="700">Week 19</text>

    <rect x="185" y="80" width="150" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="260" y="106" text-anchor="middle" font-weight="700" font-size="15">Code</text>
    <text x="197" y="134">secure defaults</text>
    <text x="197" y="156">IDE / pre-commit</text>
    <text x="197" y="178">secret scanning</text>
    <text x="197" y="200">peer code review</text>
    <text x="197" y="250" fill="#0369a1" font-weight="700">Week 17</text>

    <rect x="350" y="80" width="150" height="200" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="425" y="106" text-anchor="middle" font-weight="700" font-size="15">Build (CI)</text>
    <text x="362" y="134">SAST (Semgrep)</text>
    <text x="362" y="156">SCA (npm audit, OSV)</text>
    <text x="362" y="178">secrets (Gitleaks)</text>
    <text x="362" y="200">security tests</text>
    <text x="362" y="250" fill="#b45309" font-weight="700">Weeks 18, 20</text>

    <rect x="515" y="80" width="150" height="200" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="590" y="106" text-anchor="middle" font-weight="700" font-size="15">Release</text>
    <text x="527" y="134">required checks</text>
    <text x="527" y="156">protected branches</text>
    <text x="527" y="178">approvals</text>
    <text x="527" y="200">signed artifacts</text>
    <text x="527" y="250" fill="#15803d" font-weight="700">Week 20, Month 8</text>

    <rect x="680" y="80" width="150" height="200" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="755" y="106" text-anchor="middle" font-weight="700" font-size="15">Deploy</text>
    <text x="692" y="134">hardened images</text>
    <text x="692" y="156">IaC scanning</text>
    <text x="692" y="178">least-privilege CI</text>
    <text x="692" y="200">secrets manager</text>
    <text x="692" y="250" fill="#b91c1c" font-weight="700">Months 6–8</text>

    <rect x="845" y="80" width="135" height="200" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="912" y="106" text-anchor="middle" font-weight="700" font-size="15">Operate</text>
    <text x="857" y="134">logging</text>
    <text x="857" y="156">detections</text>
    <text x="857" y="178">incident response</text>
    <text x="857" y="200">patching</text>
    <text x="857" y="250" fill="#475569" font-weight="700">Month 10</text>

    <line x1="170" y1="180" x2="183" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#d)"/>
    <line x1="335" y1="180" x2="348" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#d)"/>
    <line x1="500" y1="180" x2="513" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#d)"/>
    <line x1="665" y1="180" x2="678" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#d)"/>
    <line x1="830" y1="180" x2="843" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#d)"/>
  </g>
  <path d="M912,282 Q912,340 500,340 Q95,340 95,284" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="500" y="364" text-anchor="middle" font-size="13" fill="#475569">Feedback loop: incidents, pentest findings and new threats update the threat model and the CI rules.</text>
  <text x="500" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Automate what can be automated; spend human review on design and logic.</text>
</svg>
