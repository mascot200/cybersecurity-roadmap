# .github/workflows/security.yml — security checks on every push and pull request.
# Pin third-party actions to a full commit SHA in real projects (see Week 20), and let
# Dependabot update them. Tags are used here only so the example stays readable.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege for every job unless a job asks for more

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Fails the job on ERROR-severity findings from the shared and custom rules.
      - run: semgrep scan --config p/javascript --config .semgrep/ --severity ERROR --error

  dependencies:
    name: Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Block on high/critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # scan full history, not just the last commit
      # Free for personal accounts; organizations need a GITLEAKS_LICENSE secret.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
