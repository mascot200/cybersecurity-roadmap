<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs><marker id="irArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Incident response lifecycle, applied to a leaked credential</text>

  <g font-size="13" fill="#0f172a">
    <rect x="20" y="60" width="225" height="250" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="132" y="86" text-anchor="middle" font-weight="700" font-size="15" fill="#5b21b6">1 · Prepare</text>
    <text x="34" y="114">centralized, structured logs (W37)</text>
    <text x="34" y="136">detections + routing (W38)</text>
    <text x="34" y="158">runbooks and contact list</text>
    <text x="34" y="180">roles: incident lead, comms,</text>
    <text x="34" y="200">  scribe, technical leads</text>
    <text x="34" y="222">tested backups (W40)</text>
    <text x="34" y="244">tabletop exercises (W39)</text>
    <text x="34" y="290" font-size="12" fill="#5b21b6">Most of the outcome is decided here.</text>

    <rect x="265" y="60" width="225" height="250" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="377" y="86" text-anchor="middle" font-weight="700" font-size="15" fill="#075985">2 · Detect &amp; analyze</text>
    <text x="279" y="114">alert: API key used from new</text>
    <text x="279" y="134">  country + mass export</text>
    <text x="279" y="158">triage: real? scope? severity?</text>
    <text x="279" y="182">open an incident record</text>
    <text x="279" y="206">build the timeline from logs</text>
    <text x="279" y="230">preserve evidence (copies,</text>
    <text x="279" y="250">  hashes, timestamps)</text>
    <text x="279" y="290" font-size="12" fill="#075985">Write everything down, with times.</text>

    <rect x="510" y="60" width="225" height="250" rx="14" fill="#fee2e2" stroke="#dc2626"/>
    <text x="622" y="86" text-anchor="middle" font-weight="700" font-size="15" fill="#991b1b">3 · Contain, eradicate,</text>
    <text x="622" y="104" text-anchor="middle" font-weight="700" font-size="15" fill="#991b1b">recover</text>
    <text x="524" y="130">revoke/rotate the key now</text>
    <text x="524" y="152">kill sessions, block source</text>
    <text x="524" y="174">find persistence (new users,</text>
    <text x="524" y="194">  keys, roles) and remove it</text>
    <text x="524" y="216">fix the root cause (how did</text>
    <text x="524" y="236">  it leak?)</text>
    <text x="524" y="258">restore data if needed; monitor</text>
    <text x="524" y="290" font-size="12" fill="#991b1b">Contain first, then investigate deeper.</text>

    <rect x="755" y="60" width="225" height="250" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="867" y="86" text-anchor="middle" font-weight="700" font-size="15" fill="#166534">4 · Post-incident</text>
    <text x="769" y="114">blameless review</text>
    <text x="769" y="136">what happened, when, why</text>
    <text x="769" y="158">what went well / badly</text>
    <text x="769" y="180">actions with owners + dates</text>
    <text x="769" y="202">new detections and tests</text>
    <text x="769" y="224">notification duties (legal,</text>
    <text x="769" y="244">  customers, regulators)</text>
    <text x="769" y="290" font-size="12" fill="#166534">Make the next incident smaller.</text>

    <line x1="246" y1="185" x2="264" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#irArrow)"/>
    <line x1="491" y1="185" x2="509" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#irArrow)"/>
    <line x1="736" y1="185" x2="754" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#irArrow)"/>
  </g>
  <path d="M867,312 Q867,360 500,360 Q132,360 132,314" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#irArrow)"/>
  <path d="M622,312 Q560,335 430,312" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#irArrow)"/>
  <text x="530" y="346" text-anchor="middle" font-size="12" fill="#475569">new evidence → analyze again</text>
  <text x="500" y="392" text-anchor="middle" font-size="13" fill="#475569">Based on NIST SP 800-61. Revision 3 (2025) organizes the same activities under the CSF 2.0 functions</text>
  <text x="500" y="412" text-anchor="middle" font-size="13" fill="#475569">Govern, Identify, Protect, Detect, Respond and Recover. The four phases above remain a practical way to run an incident.</text>
</svg>
