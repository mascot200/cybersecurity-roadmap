title: Password Spraying Against Application Login
id: 7e2b8d14-3a65-4f1c-8c2e-5d9a0b4f6c22
status: experimental
description: >-
  A single source IP fails to log in to many different accounts in a short time,
  the pattern of password spraying.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: cybersecurity-roadmap lab
date: 2026-10-28
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: invoices_api
  category: application
detection:
  selection:
    event: login
    outcome: failure
  condition: selection
falsepositives:
  - Shared egress IPs (corporate NAT, mobile carriers) with many users mistyping passwords
level: high
# Correlation (distinct accounts per IP over 10 minutes, threshold 15) is expressed with a Sigma
# correlation rule or in the SIEM; see detections.py password_spraying() for the logic.
