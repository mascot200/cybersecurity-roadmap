apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: invoices
automountServiceAccountToken: false     # the API never talks to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: invoices
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/YOUR-USER/hardened-api@sha256:REPLACE_WITH_DIGEST   # pinned by digest
          ports:
            - containerPort: 3000
          env:
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db/password
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: db-secret, mountPath: /run/secrets/db, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: db-secret
          secret:
            secretName: db-credentials
            defaultMode: 0400
