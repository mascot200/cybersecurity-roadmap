# A deploy identity that can manage the app's Deployments and Services in ONE namespace,
# read pods/logs for debugging, and do nothing with Secrets or RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: invoices
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: invoices
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: invoices
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: invoices
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
